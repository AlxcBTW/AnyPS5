name: Performance report

on:
  pull_request:
    paths:
      - 'core/shader/**'
      - 'core/libs/prx/libSceAgcDriver/**'
      - 'tools/perf_report.py'
      - '.github/workflows/perf-report.yml'
  push:
    branches: [main]
    paths:
      - 'core/shader/**'
      - 'core/libs/prx/libSceAgcDriver/**'
      - 'tools/perf_report.py'
      - '.github/workflows/perf-report.yml'

permissions:
  contents: read

concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CONFIGURE: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DANYPS5_ENABLE_SPIRV_TOOLS=ON
    -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_FLAGS=-DANYPS5_ENABLE_ASAN=1
    -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          submodules: true
          persist-credentials: false
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: perf
          evict-old-files: job
      - name: Install valgrind and the audio development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind libpipewire-0.3-dev libpulse-dev libasound2-dev
      - env:
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        run: |
          out=$RUNNER_TEMP/out report=$RUNNER_TEMP/report
          head=$(git rev-parse HEAD)
          base=$(git rev-parse HEAD^1)
          tool=$RUNNER_TEMP/perf_report.py
          cp tools/perf_report.py "$tool"
          targets=$(python3 "$tool" targets)
          mkdir -p "$out" "$report"
          ulimit -s 1048576
          for side in base head; do
            git checkout --quiet --detach "${!side}"
            git submodule update --init --recursive --quiet
            cmake -S . -B "build-$side" $CONFIGURE
            cmake --build "build-$side" --target $targets
            python3 "$tool" run "build-$side" "$out/$side.json" --repeats 2
          done
          git checkout --quiet --detach "$head"
          if [ "$EVENT" = pull_request ]; then
            echo "$PR" > "$report/pr"
            body=$(python3 "$tool" compare "$out/base.json" "$out/head.json")
            printf '### Performance report (%s → %s)\n\n%s\n' "${base::7}" "${head::7}" "$body" > "$report/report.md"
            cat "$report/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          cp "$out/base.json" "$out/head.json" "$report/"
      - uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: ${{ runner.temp }}/report
